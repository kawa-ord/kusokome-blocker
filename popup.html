<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KusokomeBlocker クソコメ☆ブロッカー</title>
    <style>
      body {
        width: 320px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        background: #ffffff;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 12px 0;
        color: #2c3e50;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status {
        padding: 10px;
        background-color: #27ae60;
        color: white;
        border-radius: 6px;
        text-align: center;
        font-weight: 500;
        font-size: 13px;
        margin-bottom: 16px;
      }

      .info {
        font-size: 13px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 12px;
      }

      .criteria {
        background-color: #f8f9fa;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 16px;
      }

      .criteria h3 {
        margin: 0 0 8px 0;
        font-size: 13px;
        color: #2c3e50;
      }

      .criteria ul {
        margin: 0;
        padding-left: 20px;
        font-size: 12px;
        line-height: 1.6;
      }

      .criteria li {
        margin-bottom: 4px;
        color: #555;
      }

      .support-section {
        border-top: 1px solid #e0e0e0;
        padding-top: 14px;
        margin-top: 16px;
        text-align: center;
      }

      .support-text {
        font-size: 12px;
        color: #666;
        margin-bottom: 10px;
      }

      .support-button {
        display: inline-block;
        padding: 6px 14px;
        background-color: #e0e0e0;
        color: #555;
        text-decoration: none;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        transition: background-color 0.2s ease;
        cursor: pointer;
      }

      .support-button:hover {
        background-color: #d0d0d0;
      }

      .version {
        text-align: center;
        font-size: 10px;
        color: #999;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <h1>KusokomeBlocker🛡️クソコメ☆ブロッカー</h1>

    <div class="status">✓ 有効化されています</div>

    <div class="info">Yahoo!Newsコメント欄の低品質コメントを自動非表示。読むに値しない、目にもしたくない、ノイズレベルのコメントを視界から消し去ります。</div>

    <div class="criteria">
      <h3>📊 非表示基準</h3>
      <ul>
        <li>総投票数が10件未満</li>
        <li>「うーん」が肯定票より多い</li>
        <li>「うーん」が50%以上</li>
      </ul>
    </div>

    <div class="support-section">
      <div class="support-text">このツールが役に立ちましたか？</div>
      <a href="https://ko-fi.com/ordbro" target="_blank" class="support-button"> ☕ このアドオンを応援する </a>
    </div>

    <div class="version">version 2.0</div>
  </body>
</html>
