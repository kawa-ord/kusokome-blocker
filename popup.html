<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KusokomeBlocker クソコメ☆ブロッカー</title>
    <style>
      body {
        box-sizing: border-box;
        width: 340px;
        padding: 18px;
        margin: 0;
        background: #ffffff;
        color: #263445;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      h1 {
        font-size: 16px;
        line-height: 1.4;
        margin: 0 0 14px 0;
        color: #243447;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status {
        padding: 11px 12px;
        background-color: #218c58;
        color: white;
        border-radius: 6px;
        text-align: center;
        font-weight: 500;
        font-size: 13px;
        margin-bottom: 16px;
        letter-spacing: 0.01em;
      }

      .info {
        font-size: 13px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 12px;
      }

      .criteria {
        background-color: #f5f7fa;
        border: 1px solid #e8edf2;
        padding: 13px;
        border-radius: 8px;
        margin-bottom: 16px;
      }

      .criteria h3 {
        margin: 0 0 8px 0;
        font-size: 13px;
        color: #2c3e50;
      }

      .criteria ul {
        margin: 0;
        padding-left: 20px;
        font-size: 12px;
        line-height: 1.6;
      }

      .criteria li {
        margin-bottom: 4px;
        color: #555;
      }

      .support-section {
        border-top: 1px solid #e0e0e0;
        padding-top: 14px;
        margin-top: 16px;
        text-align: center;
      }

      .support-text {
        font-size: 12px;
        color: #666;
        margin-bottom: 10px;
      }

      .support-button {
        display: inline-block;
        padding: 7px 15px;
        background-color: #edf1f5;
        color: #394b5e;
        text-decoration: none;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        transition: background-color 0.2s ease;
        cursor: pointer;
      }

      .support-button:hover {
        background-color: #dce4ec;
      }

      .support-button:focus-visible,
      .international-link a:focus-visible {
        outline: 2px solid #2878bd;
        outline-offset: 3px;
      }

      .international-link {
        margin-top: 8px;
        font-size: 10px;
        color: #999;
      }

      .international-link a {
        color: #999;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .international-link a:hover {
        color: #666;
        text-decoration: underline;
      }

      .release-meta {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
        color: #8a96a3;
        font-size: 10px;
      }

      .release-meta span + span {
        padding-left: 10px;
        border-left: 1px solid #dce2e8;
      }
    </style>
  </head>
  <body>
    <h1>KusokomeBlocker🛡️クソコメ☆ブロッカー</h1>

    <div class="status">✓ 有効化されています</div>

    <div class="info">Yahoo!Newsコメント欄の低品質コメントを自動非表示。読むに値しない、目にもしたくない、ノイズレベルのコメントを視界から消し去ります。</div>

    <div class="criteria">
      <h3>📊 非表示基準</h3>
      <ul>
        <li>総投票数が10件未満</li>
        <li>「うーん」が肯定票より多い</li>
        <li>「うーん」が50%以上</li>
      </ul>
    </div>

    <div class="support-section">
      <div class="support-text">このツールが役に立ちましたか？</div>
      <a href="https://ko-fi.com/ordbro" target="_blank" class="support-button"> ☕ このアドオンを応援する </a>
      <div class="international-link">
        <a href="https://ord.fanbox.cc/" target="_blank">→ ☕ Pixivユーザーはコチラ</a>
      </div>
    </div>

    <div class="release-meta"><span>Version 2.1.1</span><span>Last Update: 2026.11.03</span></div>
  </body>
</html>
