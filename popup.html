<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-Blocker 設定</title>
    <style>
      body {
        width: 300px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
      }

      h1 {
        font-size: 18px;
        margin: 0 0 16px 0;
        color: #2c3e50;
      }

      .status {
        padding: 12px;
        background-color: #27ae60;
        color: white;
        border-radius: 6px;
        text-align: center;
        font-weight: 500;
        margin-bottom: 16px;
      }

      .info {
        font-size: 13px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 12px;
      }

      .criteria {
        background-color: #ecf0f1;
        padding: 12px;
        border-radius: 6px;
        font-size: 12px;
        margin-top: 12px;
      }

      .criteria h3 {
        margin: 0 0 8px 0;
        font-size: 13px;
        color: #2c3e50;
      }

      .criteria ul {
        margin: 0;
        padding-left: 20px;
      }

      .criteria li {
        margin-bottom: 6px;
        color: #555;
      }

      .version {
        text-align: center;
        font-size: 11px;
        color: #999;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>🛡️ K-Blocker</h1>

    <div class="status">✓ 有効化されています</div>

    <div class="info">Yahoo!Newsコメント欄の低品質コメントを自動的に非表示にします。</div>

    <div class="criteria">
      <h3>📊 非表示基準</h3>
      <ul>
        <li>総投票数が10件未満</li>
        <li>「うーん」が肯定票より多い</li>
        <li>「うーん」が50%以上</li>
      </ul>
    </div>

    <div class="version">version 1.0.0</div>

    <script>
      // 将来の拡張: 設定保存機能など
      // chrome.storage.sync を使った設定管理を実装予定
    </script>
  </body>
</html>
